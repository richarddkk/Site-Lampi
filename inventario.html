<body id="inventario-page">
    <nav class="navbar">
        <div class="nav-brand">
            <div class="logo-placeholder"><i class="fa-regular fa-lightbulb"></i></div>
            LAMPI

            <li><a href="#" onclick="logout()" style="color: var(--danger);"><i class="fa-solid fa-power-off"></i> Sair</a></li>
        </ul>
    </nav>

    <main class="container">
        <section class="section-header">
            <h2>Gestão de Patrimônio do LAMPI</h2>
            <p>Controle de tombos, notebooks, sensores e responsáveis atuais.</p>
        </section>

        <div class="card" style="margin-bottom: 2rem;">
            <h3><i class="fa-solid fa-plus"></i> Adicionar / Editar Equipamento</h3>
            <form id="form-add-item" style="margin-top: 1.5rem; display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
                <div class="form-group" style="flex: 1; min-width: 150px;">
                    <label>Nº do Tombo</label>
                    <input type="text" id="item-tombo" class="form-control" required>
                </div>
                <div class="form-group" style="flex: 2; min-width: 200px;">
                    <label>Equipamento</label>
                    <input type="text" id="item-name" class="form-control" required>
                </div>
                <div class="form-group" style="flex: 1; min-width: 150px;">
                    <label>Status</label>
                    <select id="item-status" class="form-control">
                        <option value="Disponível">Disponível</option>
                        <option value="Em uso">Em uso</option>
                        <option value="Manutenção">Manutenção</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1; min-width: 150px;">
                    <label>Responsável</label>
                    <input type="text" id="item-user" class="form-control" placeholder="Opcional">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-green" style="height: 48px;">Registrar</button>
                </div>
            </form>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>Tombo</th>
                    <th>Equipamento</th>
                    <th>Status</th>
                    <th>Responsável</th>
                    <th style="width: 100px;">Ações</th>
                </tr>
            </thead>
            <tbody id="inventory-tbody"></tbody>
        </table>
    </main>

<!-- 1. Importações do SDK Firebase via CDN -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- 2. Banco de Dados -->
<script src="assets/js/firebase-db.js"></script>

<!-- 3. Controle de Sessão -->
<script src="assets/js/auth.js"></script>

<!-- 4. Lógica do Sistema -->
<script src="assets/js/apps.js"></script>
