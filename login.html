<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAMPI | Login</title>
    <link rel="icon" type="image/x-icon" href="LampiLogo.ico">
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body id="login-page" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
        <div class="logo-placeholder" style="margin: 0 auto 1.5rem auto; width: 60px; height: 60px; font-size: 2rem;">
            <i class="fa-regular fa-lightbulb"></i>
        </div>
        <h2 style="color: var(--primary); margin-bottom: 0.5rem;">Acesso ao LAMPI</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Insira suas credenciais para continuar.</p>

        <form id="form-login" style="text-align: left;">
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="login-user" class="form-control" placeholder="Ex: Richard" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="login-pass" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-green" style="width: 100%; justify-content: center; margin-top: 1rem; height: 48px;">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar
            </button>
        </form>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
